[package]
name = "worldfa-admin"
version = "0.1.7"
description = "Espace admin World:FA - application de bureau"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Le binaire part en telechargement a chaque mise a jour : chaque Mo compte.
strip = true
lto = true
codegen-units = 1
