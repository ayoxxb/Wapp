# Compilation du .exe Windows et depot sur worldfa.fr — declenchee par un tag
# de version (v0.1.1, v0.2.0...) pousse par ./publier-version.sh, ou a la main
# depuis l'onglet Actions.
#
# Les deux secrets a poser dans Settings > Secrets and variables > Actions :
#   TAURI_SIGNING_PRIVATE_KEY  — la clef qui signe les mises a jour ;
#                                l'application refuse tout installeur qui n'en
#                                porte pas la signature.
#   APP_PUBLISH_SECRET         — le meme que dans le .env de worldfa :
#                                il autorise le depot sur worldfa.fr/app.
name: publier

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Le cache Rust fait passer les compilations suivantes de ~15 min a ~4.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependances
        run: npm ci

      - name: Compiler et signer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build

      - name: Deposer sur worldfa.fr
        shell: pwsh
        env:
          SECRET: ${{ secrets.APP_PUBLISH_SECRET }}
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $v = $conf.version
          $exe = "src-tauri/target/release/bundle/nsis/WorldFA-Admin_${v}_x64-setup.exe"
          $sig = "$exe.sig"
          if (-not (Test-Path $exe)) { throw "installeur introuvable : $exe" }
          if (-not (Test-Path $sig)) { throw "signature introuvable : $sig (createUpdaterArtifacts ?)" }

          # L'ordre compte : le manifeste est refuse par worldfa tant que
          # l'installeur et la signature ne sont pas deja deposes.
          foreach ($etape in @(@("exe", $exe), @("sig", $sig))) {
            $code = & curl.exe -s -o reponse.json -w "%{http_code}" -X POST `
              "https://worldfa.fr/app/publier?etape=$($etape[0])&version=$v" `
              -H "X-App-Publish-Secret: $env:SECRET" `
              --data-binary "@$($etape[1])"
            Get-Content reponse.json
            if ($code -ne "200") { throw "depot $($etape[0]) refuse ($code)" }
          }
          $code = & curl.exe -s -o reponse.json -w "%{http_code}" -X POST `
            "https://worldfa.fr/app/publier?etape=manifest&version=$v" `
            -H "X-App-Publish-Secret: $env:SECRET" `
            --data-binary "Version $v"
          Get-Content reponse.json
          if ($code -ne "200") { throw "manifeste refuse ($code)" }
          Write-Host "Version $v publiee : https://worldfa.fr/app/WorldFA-Admin_${v}_x64-setup.exe"

      # L'installeur reste aussi accroche au run GitHub : si worldfa.fr etait
      # injoignable au moment du depot, rien n'est perdu.
      - uses: actions/upload-artifact@v4
        with:
          name: installeur
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
